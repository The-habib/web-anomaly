		<script>
			// Routes that should never show the splash screen. Prefix-matched against
			// the current pathname â add more entries here as needed.
			window.NO_SPLASH_ROUTES = ['/files/', '/v2/file/preview'];
			window.shouldSkipSplash = () =>
				window.NO_SPLASH_ROUTES.some((route) => window.location.pathname.startsWith(route));

			// Suppress the splash before the body paints to avoid a flash on these routes.
			if (window.shouldSkipSplash()) {
				const style = document.createElement('style');
				style.textContent = '#splash-screen { display: none !important; }';
				document.head.appendChild(style);
			}

			// Signed-out `/` renders the dark landing page, which brings its own
			// lottie loading splash â restyle the static splash into a seamless
			// dark veil (no logo) so the boot doesn't flash the white app splash
			// before it.
			window.isLandingBoot = () => {
				try {
					return window.location.pathname === '/' && !localStorage.getItem('token');
				} catch (e) {
					return false;
				}
			};
			if (window.isLandingBoot()) {
				const style = document.createElement('style');
				style.textContent = '#splash-screen { background: #141311 !important; }';
				document.head.appendChild(style);

				// Warm the splash animation while the JS bundle downloads, so the
				// in-app lottie player paints its first frame the moment it mounts.
				// crossorigin=anonymous matches the player's fetch() credentials mode â
				// without it the preload is discarded and the file downloads twice.
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'fetch';
				preload.crossOrigin = 'anonymous';
				preload.href = '/static/landing_page_splash.lottie';
				document.head.appendChild(preload);
			}
		</script>

		<script>
			// Always force light theme â no user switching allowed
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');

				document.documentElement.classList.add('light');
				metaThemeColorTag.setAttribute('content', '#ffffff');
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: 14rem; height: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); display:block;';
				logo.src = '/static/inch-logo.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (
						document.documentElement.classList.contains('her') ||
						window.shouldSkipSplash() ||
						window.isLandingBoot()
					) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

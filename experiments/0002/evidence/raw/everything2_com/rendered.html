<script id="nodeinfojson">e2 = {"contentData":{"hero":{"headline":"Everything2","description":"Our writers explore everything from personal narratives to technical deep-dives, fiction to philosophy, book reviews to recipes, travel journals to dream logs - all in a space that values craft, curiosity, and genuine human expression.","cta":{"url":"/title/Cool%20Archive","text":"Start Reading"},"tagline":"A community-driven writing platform since 1999"},"type":"guest_front_page","news":[{"createtime":"2026-08-11 15:20:48","content":"<br />\n\n<b>August 4:</b> Happy birthday [avalyn[user]|avalyn]!<br /><br />\n\n<b>August 6:</b> [August 6, 1945|広島] <br /><br />\n\n<b>August 9:</b> [August 9, 1945|長崎]<br /><br />\n\n<b>August 27:</b> Happy birthday [Bitriot[user]|Bitriot]! <br /><br />\n\n\n<p><small><i>If you have an item for this calendar, /msg [Tem42].</i></small></p> ","linkedby":null,"title":"Everything2 News, August 2026","node_id":"2214195","author":{"title":"Tem42","node_id":"7392"}},{"title":"Everything2 News, July 2026","node_id":"2213965","author":{"node_id":"7392","title":"Tem42"},"linkedby":null,"createtime":"2026-07-02 22:16:42","content":"<p><b>July 1:</b> [Canada Day].</p>\n\n<p><b>July 4:</b> [Fourth of July|America Day].</p>\n\n<p><b>July 25:</b> Happy birthday [TanisNikana]!</p>\n\n<p><b>July 26:</b> Happy birthday [teleny]!</p>\n\n<br />\n<p><i>If you have anything to add to this calendar, let [Tem42] know.</i></p>"},{"createtime":"2026-06-12 02:30:57","content":"<p><b>June 3</b>: [Saint kevin's Day].</p>\n\n<p><b>June 4</b>: [Aesop]'s Birthday.</p>\n\n<p><b>June 11</b>: [TerribleAspect]'s birthday!</p>\n\n<p><b>June 13</b>: [Serjeant's Muse]'s birthday!</p>\n\n<p><b>June 16</b>: [Bloomsday].</p>\n\n<p><b>June 19</b>: [Juneteenth].</p>\n\n<p><b>June 21</b>: Summer [solstice] (northern hemisphere) and winter solstice (southern hemisphere). </p>\n\n<p><b>June 23</b>: [AdamTheDewott]'s birthday!</p>\n\n<p><b>June 28</b>: [Tau] Day. </p>\n\n<br />\n<p><i>If you have an item for this calendar, /msg Tem42.<i></p>","linkedby":null,"title":"Everything2 News, June 2026","author":{"title":"Tem42","node_id":"7392"},"node_id":"2213852"},{"author":{"title":"Tem42","node_id":"7392"},"node_id":"2213634","title":"Everything2 News, May 2026","createtime":"2026-05-02 01:28:22","content":"<p><b>May 1</b>: [May day].</p>\n<p><b>May 3</b>: Happy birthday [ImConfused]!</p>\n<p><b>May 4</b>: [May the Fourth be with you]!</p>\n<p><b>May 8</b>: Happy birthday [E2D2]!</p>\n<p><b>May 10</b>: Happy birthday [BIII]!</p>\n<p><b>May 10</b>: [Mother's day] in the USA.</p>\n<p><b>May 25</b>: [Memorial Day] in the USA.</p>\n\n\n<br />\n<p><small><i>If you have an item for this calendar, /msg Tem42.</i></small></p>","linkedby":null},{"author":{"title":"Tem42","node_id":"7392"},"node_id":"2213538","title":"Everything2 News, April 2026","createtime":"2026-04-02 00:32:29","content":"<p><b>April 1</b>: Due to a database glitch, all Quests start today. Node freely. </p>\n<p><b>April 10</b>: Happy birthday, [nuggets[user]|nuggets]!</p>\n<p><b>April 12</b>: [Yuri's Night]</p>\n<p><b>April 22</b>: Happy [Earth Day], fellow earthlings!</p>\n<p><b>April 23</b>: [Saint George's Day].</p>\n<p><b>April 24</b>: Happy birthday, [Rancid_Pickle[user]|Rancid_Pickle]!</p>\n<p><b>April 30</b>: [Walpurgis Night].\n\n<p><small>If you have something to add to the monthly news, /msg [Tem42].</small></p>","linkedby":null}],"bestofweek":[{"author":{"title":"lostcauser","node_id":"1992599"},"node_id":"2214216","parent":{"title":"Bring It On Home to Me (Yeah)","node_id":"2214217"},"type":"personal","content":"<p>I love that her name is Cyndi, that she spells it like [Cyndi Lauper]. I love how open she is with the other [nurse] whose [name tag] I can’t see and I love Carlos, Cyndi’s [betrothed], and that Cyndi calls him a “player.” She calls him a “dog” and I love that Cyndi smiles and the other nurse never does.</p><p>Cyndi is four months [pregnant]. Cyndi loves being pregnant. She loves [babies] and I love Cyndi and I love her turquoise [scrubs] and that she and Carlos [squabble] over little things so they don’t have to fight about big ones. You did this. Well you did that. It’s a mute point, Cyndi says.</p><p>She means “moot point.” She does not know she means “moot point” but she does, and she may not know who Cyndi Lauper is or that between five and ten per cent of the [pregnant women] in this [country] are abused, in varying ways, by the man whose [child] is growing in their [belly].</p><p>Cyndi may not know whether Carlos has that in him. And Carlos may not know, and I miss part of what they’re saying","truncated":1},{"content":"<p>I for one loathe [short-form video]. I my experience and opinion, it's generally irritating and devoid of content. The presenters are, I feel, more concerned with being liked by their chose demographic. At the end Im often left baffled by the purpose of the content.Videos of this nature usually have a irritating (to me) soundtrack, risky cuts and I am subjected to the YouTube algorithms suggesting them to me all too often. I generally ignore them to seek out longer-form content (that's why I'm on YouTube in the firstplace, to be informed, challenged, educated. One of the primary uses of Shorts seems to be established YouTubers trying to drive more views for their  content to drive up views, engagement and subscriber metrics. It generally fails to work for me, though it did introduce me toYouTuber minimimuteman, who expounds on archaeology, debunks pseudoscience and produces generally interesting material on archeology, hisory, geology and whatever takes his fancy that week. I should be grateful to his","type":"opinion","parent":{"title":"YouTube Shorts","node_id":"2211216"},"truncated":1,"node_id":"2214229","author":{"title":"wertperch","node_id":"958245"}},{"author":{"title":"etouffee","node_id":"1153472"},"node_id":"2214224","parent":{"node_id":"2214218","title":"Your heart requires moonlight"},"content":"<p></p><p></p><h1 align=\"center\"><em><sub><sup>“It was a very nice letter you wrote by the light of the stars. Always write then, for your heart requires moonlight to deliquesce it. ” - [Virginia Woolf]</sup></sub></em></h1><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p>.</p><p>.</p><p></p><p></p><p>.</p><p></p><p></p><p>Your mornings need flowers,</p><p> [<strong>Tell me a story about flowers|</strong>Bright colors to balance the cold and damp]</p><p></p><p>.</p><p></p><p></p><p>I bet your shoulders need soft chairs or</p><p>Firm hands to chase away the stress</p><p></p><p></p><p></p><p></p><p>.</p><p>Perhaps your lips desire a glass of wine, or </p><p>They may dream of the taste of another’s</p><p></p><p>.</p><p></p><p>[windows left open not for the breeze, for moonlight|I am only sure of the moonlight]</p><p>Because you need its soft lamp for your words,</p><p>And the way it moves across your bed</p><p></p><p></p><p></p><p></p><p>.</p><p></p><p></p>","type":"person","truncated":0}],"hidePageHeader":1,"is_guest":1,"pagenodelets":["2029388","2027508","263"]},"display_prefs":{"vit_hidelist":0,"edn_hideutil":0,"rtn_hideedc":0,"rtn_hidecwu":0,"num_newwus":"10","nw_nojunk":false,"vit_hidemisc":0,"rtn_hidenws":0,"edn_hideedev":0,"vit_hidemaintenance":0,"vit_hidenodeutil":0,"vit_hidenodeinfo":0},"use_local_assets":"0","pageheader":{},"user":{"title":"Guest User","node_id":"779713","developer":false,"editor":false,"chanop":false,"in_room":0,"admin":false,"guest":true},"lastnode_id":null,"nodetype":"fullpage","staffpicks":[{"title":"The Elder Scrolls V: Skyrim","node_id":"2055450","type":"e2node"},{"title":"The Infamous Bell Tower Prank of 1996","node_id":"928219","type":"e2node"},{"node_id":"573777","title":"Taliesin","type":"e2node"},{"title":"Book of Love","node_id":"1047259","type":"e2node"},{"node_id":"1861847","title":"January 31, 2007","type":"e2node"},{"type":"e2node","node_id":"80466","title":"kindergarten"},{"title":"In which the mountai

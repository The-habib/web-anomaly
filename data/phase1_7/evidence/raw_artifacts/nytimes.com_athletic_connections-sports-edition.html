subscription. Subscriptions continue to renew automatically until cancelled. You can manage and cancel subscriptions using the Google Play subscription center. Current subscribers not eligible. Having previously accepted an introductory offer for a subscription to The Athletic may make you ineligible for this current offer. Canceling your subscription to The Athletic will not cancel your subscription to The New York Times, and canceling your subscription to The New York Times will not cancel your subscription to The Athletic. The print edition of The New York Times, digital access to New York Times news content, Games, Cooking or Wirecutter are not included. Taxes may apply. Offer terms are subject to change. Offer is for new subscribers to The Athletic only. By selecting a pricing option you agree to the automatic renewal terms stated above, The New York Times Privacy Policy and The New York Times Terms of Service.\"},\"terms_text_android_trial\":{\"param_type\":\"string\",\"ref_type\":\"static\",\"value\":\"If you subscribe to The Athletic via Google, payment for your subscription will be automatically charged to your Google Play account upon confirmation. Subscriptions renew automatically 24-hours prior to the start of the next billing period. For special introductory offers, you will be automatically charged the applicable introductory rate shown to you at the time of subscription for the stated introductory period and the standard rate rate shown to you at the time of subscription thereafter. Billing occurs every calendar month for a monthly subscription or once-yearly for an annual subscription. Subscriptions continue to renew automatically until cancelled. You can manage and cancel subscriptions using the Google Play subscription center. Current subscribers not eligible. Having previously accepted an introductory offer for a subscription to The Athletic may make you ineligible for this current offer. Canceling your subscription to The Athletic will not cancel your subscription to The New York Times, and canceling your subscription to The New York Times will not cancel your subscription to The Athletic. The print edition of The New York Times, digital access to New York Times news content, Games, Cooking or Wirecutter are not included. Taxes may apply. Offer terms are subject to change. Offer is for new subscribers to The Athletic only. If you cancel before the end of the free trial, you will not be charged. After the free trial period, you will automatically become a paying subscriber. If you choose to upgrade or downgrade your subscription during a free trial period, you will forfeit the remainder of the free trial. By selecting a pricing option you agree to the automatic renewal terms stated above, The New York Times Privacy Policy and The New York Times Terms of Service.\"},\"terms_text_ios\":{\"param_type\":\"string\",\"ref_type\":\"static\",\"value\":\"If you subscribe to The Athletic via this app, payment for your subscription will be automatically charged to your Apple ID account upon your confirmation of purchase with Apple. Your Apple ID account will be automatically charged for renewal at the applicable rate shown to you at the time of subscription every calendar month (for monthly subscriptions) or every year (for annual subscriptions) within 24-hours prior to the start of your next billing period. For special introductory offers, you will be automatically charged the applicable introductory rate shown to you at the time of subscription for the stated introductory period and the standard rate rate shown to you at the time of subscription thereafter. You will be charged in advance. Subscriptions continue automatically until you cancel. Cancellation takes effect at the end of your current billing period. You can manage and cancel subscriptions in your account settings on the App Store. To cancel, please turn off auto-renew at least 24-hours before the end of your current billing period from your iTunes account settings.\\\\n\\\\nCurrent subscribers not eligible. Having previously accepted an introductory offer for a subscription to The Athletic may make you ineligible for this current offer. Canceling your subscription to The Athletic will not cancel your subscription to The New York Times, and canceling your subscription to The New York Times will not cancel your subscription to The Athletic. The print edition of The New York Times, digital access to New York Times news content, Games, Cooking or Wirecutter are not included. Taxes may apply. Offer terms are subject to change. Offer is for new subscribers to The Athletic only.\\\\n\\\\nBy selecting a pricing option you agree to the automatic renewal terms stated above, [The New York Times Privacy Policy](https://www.nytimes.com/privacy/privacy-policy) and [The New York Times Terms of Service](https://help.nytimes.com/hc/en-us/articles/115014893428-Terms-of-service).\"},\"terms_text_ios_trial\":{\"param_type\":\"string\",\"ref_type\":\"static\",\"value\":\"If you subscribe to The Athletic via this app, payment for your subscription will be automatically charged to your Apple ID account upon your confirmation of purchase with Apple. Your Apple ID account will be automatically charged for renewal at the applicable rate shown to you at the time of subscription every calendar month (for monthly subscriptions) or every year (for annual subscriptions) within 24-hours prior to the start of your next billing period. For special introductory offers, you will be automatically charged the applicable introductory rate shown to you at the time of subscription for the stated introductory period and the standard rate rate shown to you at the time of subscription thereafter. You will be charged in advance. Subscriptions continue automatically until you cancel. Cancellation takes effect at the end of your current billing period. You can manage and cancel subscriptions in your account settings on the App Store. To cancel, please turn off auto-renew at least 24-hours before the end of your current billing period from your iTunes account settings.\\\\n\\\\nCurrent subscribers not eligible. Having previously accepted an introductory offer for a subscription to The Athletic may make you ineligible for this current offer. Canceling your subscription to The Athletic will not cancel your subscription to The New York Times, and canceling your subscription to The New York Times will not cancel your subscription to The Athletic. The print edition of The New York Times, digital access to New York Times news content, Games, Cooking or Wirecutter are not included. Taxes may apply. Offer terms are subject to change. Offer is for new subscribers to The Athletic only.\\\\n\\\\nIf you cancel before the end of the free trial, you will not be charged. After the free trial period, you will automatically become a paying subscriber. If you choose to upgrade or downgrade your subscription during a free trial period, you will forfeit the remainder of the free trial.\\\\n\\\\nBy selecting a pricing option you agree to the automatic renewal terms stated above, [The New York Times Privacy Policy](https://www.nytimes.com/privacy/privacy-policy) and [The New York Times Terms of Service](https://help.nytimes.com/hc/en-us/articles/115014893428-Terms-of-service).\"},\"title\":{\"experiment_name\":\"38637629\",\"param_name\":\"title\",\"param_type\":\"string\",\"ref_type\":\"experiment\"},\"title_non_eligible\":{\"param_type\":\"string\",\"ref_type\":\"static\",\"value\":\"Get unlimited access.\"}},\"1298966021\":{\"is_intro_offer_re_eligibility_enabled\":{\"param_type\":\"boolean\",\"ref_type\":\"static\",\"value\":true},\"is_paywall_redesign\":{\"experiment_name\":\"1456173385\",\"param_name\":\"is_paywall_redesign\",\"param_type\":\"boolean\",\"ref_type\":\"experiment\"},\"variant\":{\"experiment_name\":\"3804282651\",\"param_name\":\"variant\",\"param_type\":\"string\",\"ref_type\":\"experiment\"}},\"1316408423\":{\"is_native_pla

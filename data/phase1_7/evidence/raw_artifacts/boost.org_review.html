      function removejscssfile(filename, filetype){
        var targetelement=(filetype=="js")? "script" : (filetype=="css")? "link" : "none" //determine element type to create nodelist from
        var targetattr=(filetype=="js")? "src" : (filetype=="css")? "href" : "none" //determine corresponding attribute to test for
        var allsuspects=document.getElementsByTagName(targetelement)
          for (var i=allsuspects.length; i>=0; i--){ //search backwards within nodelist for matching elements to remove
          if (allsuspects[i] && allsuspects[i].getAttribute(targetattr)!=null && allsuspects[i].getAttribute(targetattr).indexOf(filename)!=-1)
              allsuspects[i].parentNode.removeChild(allsuspects[i]) //remove element by calling parentNode.removeChild()
          }
      }
      document.onreadystatechange = () => {
        if (document.readyState === 'complete') {
          removejscssfile("boostbook.css", "css")
          var guide = document.getElementById("guideMenu")
          guide.classList.remove("hidden");
        }
      }
    </script>

      function removejscssfile(filename, filetype){
        var targetelement=(filetype==&quot;js&quot;)? &quot;script&quot; : (filetype==&quot;css&quot;)? &quot;link&quot; : &quot;none&quot; //determine element type to create nodelist from
        var targetattr=(filetype==&quot;js&quot;)? &quot;src&quot; : (filetype==&quot;css&quot;)? &quot;href&quot; : &quot;none&quot; //determine corresponding attribute to test for
        var allsuspects=document.getElementsByTagName(targetelement)
          for (var i=allsuspects.length; i&gt;=0; i--){ //search backwards within nodelist for matching elements to remove
          if (allsuspects[i] &amp;&amp; allsuspects[i].getAttribute(targetattr)!=null &amp;&amp; allsuspects[i].getAttribute(targetattr).indexOf(filename)!=-1)
              allsuspects[i].parentNode.removeChild(allsuspects[i]) //remove element by calling parentNode.removeChild()
          }
      }
      document.onreadystatechange = () =&gt; {
        if (document.readyState === &#x27;complete&#x27;) {
          removejscssfile(&quot;boostbook.css&quot;, &quot;css&quot;)
          var guide = document.getElementById(&quot;guideMenu&quot;)
          guide.classList.remove(&quot;hidden&quot;);

&lt;h1 class=&quot;page&quot;&gt;Library Submission Process&lt;/h1&gt;
&lt;div id=&quot;preamble&quot;&gt;
&lt;div class=&quot;sectionbody&quot;&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;This page describes the process library developers go through to get a library accepted into Boost.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ulist&quot;&gt;
&lt;ul&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_steps_for_getting_a_library_accepted_by_boost&quot;&gt;Steps for Getting a Library Accepted by Boost&lt;/a&gt;&lt;/p&gt;
&lt;div class=&quot;ulist&quot;&gt;
&lt;ul&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_1_learn_about_boost&quot;&gt;1. Learn about Boost&lt;/a&gt;&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_2_determine_interest&quot;&gt;2. Determine Interest&lt;/a&gt;&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;

&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_4_make_refinements&quot;&gt;4. Make Refinements&lt;/a&gt;&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_5_get_seconded_for_review&quot;&gt;5. Get Seconded for Review&lt;/a&gt;&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;

&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;&lt;a href=&quot;#_7_participate_in_the_formal_review&quot;&gt;7. Participate in the Formal Review&lt;/a&gt;&lt;/p&gt;

&lt;div class=&quot;sect1&quot;&gt;
&lt;h2 id=&quot;_steps_for_getting_a_library_accepted_by_boost&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_steps_for_getting_a_library_accepted_by_boost&quot;&gt;&lt;/a&gt;Steps for Getting a Library Accepted by Boost&lt;/h2&gt;
&lt;div class=&quot;sectionbody&quot;&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_1_learn_about_boost&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_1_learn_about_boost&quot;&gt;&lt;/a&gt;1. Learn about Boost&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Follow posts on the &lt;a href=&quot;https://lists.boost.org/mailman/listinfo.cgi/boost&quot;&gt;Boost developers&#x27; mailing list&lt;/a&gt; for a while, or look through the &lt;a href=&quot;https://lists.boost.org/Archives/boost/&quot;&gt;message archives&lt;/a&gt;. Explore this website. Learn the &lt;a class=&quot;xref page&quot; href=&quot;../contributor-guide/requirements/library-requirements.html&quot;&gt;Library Requirements&lt;/a&gt;. Read the rest of this page to learn about the process. Search the web to get an idea of the commitment required to get a library into Boost.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;There is a culture associated with Boost, aimed at encouraging high quality libraries by a process of discussion and refinement. Some libraries get past community review in less than two years from first concept, but most take longer, sometimes a lot longer. Five to ten years to get a library past review and into Boost is not unheard of, and you should prepare yourself for the personal investment required.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_2_determine_interest&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_2_determine_interest&quot;&gt;&lt;/a&gt;2. Determine Interest&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;While participation in reviews for other submissions is not a prerequisite for submitting a library to Boost, it is highly recommended; it will acquaint you with the process and the emotional demands of a formal review. There’s nothing that quite deflates the ego like having brilliant members of the C++ community critiquing your work, but, alas, it’s worth it!&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Potential library submitters should be careful to research the prior art before beginning to design a new library. Unfortunately, now and then folks arrive at Boost with a new library into which they have invested many hours, only to find that Boost already has that functionality, and sometimes has had it for years. Candidates should also research libraries being developed by others intended for Boost - if you have an itch to scratch, often so have had others and collaboration developing their library is usually considerably more efficient than going at it alone.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Potential library submitters should also be careful to publicize, canvas for, and gauge interest in their library, ideally before beginning it, but certainly before submitting it for review. Even a superbly designed library can fail review if there isn’t enough interest in the subject matter; We can only review libraries with enough appeal to form a viable peer review. Ensuring that enough people are interested in your potential library goes a long way to ensure that.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;There are many places to publicize and canvas for a library. The &lt;a href=&quot;https://lists.boost.org/mailman/listinfo.cgi/boost&quot;&gt;Boost developers&#x27; mailing list&lt;/a&gt; ought to be your first stop in gauging interest in a possible new C++ library. Be prepared to pivot your design and focus until your proposed library finds traction. Other places useful for gauging interest in a library might be &lt;a href=&quot;https://www.reddit.com/r/cpp/&quot;&gt;Reddit/r/cpp&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;A message to the Boost developers mailing list might be as simple as &quot;Is there any interest in a library which solves Traveling Salesperson problems in linear time?&quot;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;A bit of further description or snippet of code may be helpful. By the way, the preferred format for messages on the mailing list is plain text; not rich text, HTML, etc.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Avoid posting lengthy descriptions, documentation, or code to the mailing list, and, please, no attachments. The best place to provide lengthy material is via. a web link. Project hosting services such as sourceforge, github, google code, and bitbucket serve well for this purpose.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_3_start_development&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_3_start_development&quot;&gt;&lt;/a&gt;3. Start Development&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;If response to an initial query indicates interest, then by all means make your library publicly available if you haven’t already done so.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Please commit your code to a version control system such as Git, and make your documentation available in HTML format on a public website such as Github. An issue tracker such as the one provided by Github is also highly recommended.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Your library should contain material as if it were on the boost.org web site. The closer your library reflects the final directory structure and format of the web site, the better. This makes it possible for reviewers to simply copy your code into the Boost distribution for testing.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Please verify that your library compiles and runs under at least two compilers. This flushes out obvious portability problems.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;It is recommended that you release your code under &lt;a class=&quot;xref page&quot; href=&quot;../user-guide/bsl.html&quot;&gt;the Boost Software License&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_4_make_refinements&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_4_make_refinements&quot;&gt;&lt;/a&gt;4. Make Refinements&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Discuss, refine, rewrite. Repeat until satisfied.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;The exact details of this process varies a lot. Usually it is public, on the mailing list, but frequently discussion happens in private emails. For some libraries the process is over quickly, but for others it goes on for months. It’s often challenging, and sometimes veers in completely unexpected directions.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;The &lt;a href=&quot;https://lists.boost.org/Archives/boost/&quot;&gt;mailing list archives&lt;/a&gt; of past messages is one way to see how this process worked for other Boost libraries.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Alternatively, follow the status links in the previously submitted libraries listed in &lt;a class=&quot;xref page&quot; href=&quot;review-results.html#pastreviewresults&quot;&gt;Past Review Results and Milestones&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_5_get_seconded_for_review&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_5_get_seconded_for_review&quot;&gt;&lt;/a&gt;5. Get Seconded for Review&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;When you feel that your library is ready for entry into Boost, you need to find at least one member (but preferably several) of the Boost community who is willing to publicly endorse your library for entry into Boost. A simple method of achieving this is to post to the &lt;a href=&quot;https://lists.boost.org/mailman/listinfo.cgi/boost&quot;&gt;Boost developers&#x27; mailing list&lt;/a&gt; a short description of your library, links to its github and documentation, and a request for endorsements.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;It is expected that those who endorse a library for review will have performed at least a cursory check of the library’s suitability for Boost in terms of documentation, fit with the rest of Boost and usefulness. A public endorsement of a library for review means that from an initial glance, they believe that the library has a reasonable chance to be accepted during a formal review. The expectation is that these endorsers will themselves review of the library during formal review period, though this is not binding.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Once you have a list of people who have publicly endorsed your library for review, email the &lt;a href=&quot;https://lists.boost.org/mailman/listinfo.cgi/boost&quot;&gt;Boost developers&#x27; mailing list&lt;/a&gt; to request that your library be added to the &lt;a class=&quot;xref page&quot; href=&quot;review-results.html#currentscheule&quot;&gt;Current Schedule&lt;/a&gt; where the following information will be shown:&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ulist&quot;&gt;
&lt;ul&gt;
&lt;li&gt;
&lt;p&gt;Submission (Library name)&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;Submitter (author or authors)&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;Review Manager&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;Review Dates (start and end dates of the review period)&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;Links to the status of the review, given as announcements.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_6_seek_a_review_manager&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_6_seek_a_review_manager&quot;&gt;&lt;/a&gt;6. Seek a Review Manager&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;In order to schedule a formal review, the author must find a capable volunteer to manage the review. This should be someone with knowledge of the library domain, and experience with the review process. See &lt;a class=&quot;xref page&quot; href=&quot;managing-reviews.html&quot;&gt;Managing Reviews&lt;/a&gt; for the responsibilities of the review manager.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Authors can find community members interested in managing reviews through discussion of the library on the developer list. If no one steps forward to volunteer to manage the review, it is appropriate to contact an experienced Boost member who showed interest in the library. Be considerate that managing a review is a serious commitment; for this reason, it’s better to contact the member off-list.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;If you cannot find a review manager after three weeks using the means above, and your submission is targeting eventual standardization, there is a list of Boost regulars who are also WG21 committee members who have volunteered to act as review managers in such cases. Try them in the order listed. They are: Zach Laine, Micheal Caisse, Matt Calabrese, Edward Diener, Louis Dionne, Vinnie Falco, Glen Fernandes, and David Sankel.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Once a potential review manager has been identified, contact the &lt;a class=&quot;xref page&quot; href=&quot;managing-reviews.html#reviewwizards&quot;&gt;Review Wizards&lt;/a&gt; for approval. The wizards approve review managers based on their level of participation in the Boost community.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;The review wizards will coordinate with both the author and review manager to schedule a date convenient for both.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_7_participate_in_the_formal_review&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_7_participate_in_the_formal_review&quot;&gt;&lt;/a&gt;7. Participate in the Formal Review&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Before your formal review begins, double-, triple-, and quadruple-check your library. Verify that every code example works, that all unit tests pass on at least two compilers on at least two major operating systems, and run your documentation through a spelling and grammar checker.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Please do not modify your library on its master branch during a review. Instead, modify a separate develop branch in response to feedback and reviews. For bigger ticket items of work, open issues on your issue tracker so interested people can track the fixing of specific issues raised.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;The review manager will consider all the reviews made by members of the community and arrive at a decision on whether your library is rejected, conditionally accepted or unconditionally accepted. They will post a report summarizing the decision publicly. If conditions are attached to acceptance, you will need to implement those conditions or else undergo an additional formal review.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;sect3&quot;&gt;
&lt;h4 id=&quot;_fast_track_reviews&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_fast_track_reviews&quot;&gt;&lt;/a&gt;Fast Track Reviews&lt;/h4&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;To qualify for a fast track review:&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ulist disc&quot;&gt;
&lt;ul class=&quot;disc&quot;&gt;
&lt;li&gt;
&lt;p&gt;The component must be small.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;The technique must be already in use in Boost libraries and the new component provides a common implementation.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;A full Boost-conformant implementation is available in the sandbox.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;The review wizard determines that the proposal qualifies for fast track review.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect3&quot;&gt;
&lt;h4 id=&quot;_fast_track_procedure&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_fast_track_procedure&quot;&gt;&lt;/a&gt;Fast Track Procedure&lt;/h4&gt;
&lt;div class=&quot;olist arabic&quot;&gt;
&lt;ol class=&quot;arabic&quot;&gt;
&lt;li&gt;
&lt;p&gt;The Boost review wizard posts a review announcement to the main Boost developer’s list. The fast track review period will normally last for 5 days. No two fast-track reviews will run in parallel. Fast track reviews may run during full reviews, though generally, this is to be avoided.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;After the review period ends, the submitter will post a review summary containing proposed changes to the reviewed implementation.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;The review wizard will accept or reject the proposed library and proposed changes.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;
&lt;p&gt;After applying the proposed changes, the component is checked into the repository like any other library.&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_8_respond_to_mini_review_requests&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_8_respond_to_mini_review_requests&quot;&gt;&lt;/a&gt;8. Respond to Mini-Review Requests&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;It is possible that in the review process some issues might need to be fixed as a &lt;em&gt;requirement&lt;/em&gt; for acceptance. If a review does result in conditions on acceptance, the review manager may request a &lt;em&gt;Mini-Review&lt;/em&gt;, at a later date, to determine if the conditions have been met. The Mini-Review is usually conducted by the same review manager.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_9_check_in_to_the_boost_website&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_9_check_in_to_the_boost_website&quot;&gt;&lt;/a&gt;9. Check-in to the Boost Website&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Once an accepted library is ready for inclusion on the Boost web site, the submitter is typically given Boost repository write access, and expected to check-in and maintain the library there. Contact the moderators if you need write access or direct use of the repository isn’t possible for you.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect2&quot;&gt;
&lt;h3 id=&quot;_10_update_the_people_page&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_10_update_the_people_page&quot;&gt;&lt;/a&gt;10. Update the People Page&lt;/h3&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;If the boost.org web site doesn’t already have your capsule biography and picture (optional, with not-too-serious pictures preferred!), please send them to the Boost webmaster. It is up to you as to whether or not the biography includes your email address or other contact information. The preferred picture format is .jpg, but other common formats are acceptable. The preferred image size is 500x375 but the webmaster has photo editing software and can do the image preparation if necessary.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect1&quot;&gt;
&lt;h2 id=&quot;_lifecycle&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_lifecycle&quot;&gt;&lt;/a&gt;Lifecycle&lt;/h2&gt;
&lt;div class=&quot;sectionbody&quot;&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Libraries are software; they lose their value over time if not maintained. Postings on the Boost developers or users mailing lists can alert you to potential maintenance needs; please plan to maintain your library over time. If you no longer can or wish to maintain your library, please post a message on the Boost developers mailing list asking for a new maintainer to volunteer and then spend the time to help them take over.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Orphaned libraries will be put in the care of a maintenance team, pending a search for a new maintainer.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sect1&quot;&gt;
&lt;h2 id=&quot;_rights_and_responsibilities&quot;&gt;&lt;a class=&quot;anchor&quot; href=&quot;#_rights_and_responsibilities&quot;&gt;&lt;/a&gt;Rights and Responsibilities&lt;/h2&gt;
&lt;div class=&quot;sectionbody&quot;&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;By submitting a library to Boost, you accept responsibility for maintaining your library, or finding a qualified volunteer to serve as maintainer. You must be willing to put your library and documentation under a Boost-compatible license.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;You will be expected to respond to reasonable bug reports and questions on time and to participate as needed in discussions of your library on the Boost mailing lists.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;You are free to change your library in any way you wish, and you are encouraged to actively make improvements. However, peer review is an important part of the Boost process and as such you are also encouraged to get feedback from the Boost community before making substantial changes to the interface of an accepted library.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;If at some point you no longer wish to serve as maintainer of your library, it is your responsibility to make this known to the Boost community, and to find another individual to take your place.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;paragraph&quot;&gt;
&lt;p&gt;Libraries which have been abandoned will be put in care of a maintenance team.&lt;/p&gt;
&lt;/div&gt;

    <script>
      function updateVersionAlertHeight() {
        const alert = document.querySelector('.version_alert');
        if (alert && document.getElementById('docsiframe')) {
          document.documentElement.style.setProperty('--version-alert-height', Math.ceil(alert.getBoundingClientRect().height) + 'px');
        }
      }

      (function() {
        const alert = document.querySelector('.version_alert');
        if (!alert) return;

        let rafId = null;
        const update = () => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            updateVersionAlertHeight();
            rafId = null;
          });
        };

        requestAnimationFrame(updateVersionAlertHeight);
        window.addEventListener('resize', update);
        if (window.ResizeObserver) {
          new ResizeObserver(update).observe(alert);
        }
      })();

      function iframeCustomizations(iframe) {
        let iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        
        addClickInterception(iframeDoc);
        addBase(iframeDoc);
        if (window.location.hash) {
           scrollToAnchor(iframeDoc, window.location.hash.slice(1));
        }
        // Try targeting different containers for AsciiDoc
        const scrollContainer = iframeDoc.querySelector('.sect1, #content, body') || iframeDoc.documentElement;
        scrollContainer.style.scrollBehavior = 'smooth';
      }

      function resizeIframe(obj) {
        obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
      }

      function scrollToAnchor(iframeDoc, hash) {
        const targetElement = iframeDoc.getElementById(hash);
        if (!targetElement) return;

          // Add space above the target element - more space on mobile
          const isMobile = window.innerWidth < 768;
          const topMargin = isMobile ? 50 : 14;

        // Detect document type
        const isAntora = !!iframeDoc.querySelector('.doc, .source-docs-antora');

        // First try method 1: scrollIntoView
        targetElement.scrollIntoView({block: "start", behavior: "auto"});

        // Then apply adjustments based on document type
        setTimeout(() => {
          try {
            // Method 2: Calculate position and use multiple scroll APIs
            const rect = targetElement.getBoundingClientRect();
            const scrollY = iframeDoc.defaultView.pageYOffset || iframeDoc.documentElement.scrollTop;
            const targetY = rect.top + scrollY - topMargin;

            // Use both direct property setting and scrollTo API
            iframeDoc.documentElement.scrollTop = targetY;
            iframeDoc.body.scrollTop = targetY; // For Safari

            if (isAntora) {
              // For Antora, use the defaultView scroll methods
          iframeDoc.defaultView.scrollTo({
                top: targetY,
                behavior: 'smooth'
              });
            } else {
              // For AsciiDoc, use all available scroll targets
              iframeDoc.documentElement.scrollTo({
                top: targetY,
            behavior: 'smooth'
          });

              // Special handling for AsciiDoc documents with scrollable content areas
              const scrollableContent = iframeDoc.querySelector('#content, .content');
              if (scrollableContent) {
                scrollableContent.scrollTop = targetElement.offsetTop - topMargin;
              }
            }
          } catch (e) {
            console.error('Scroll adjustment error:', e);
          }
        }, 10);
      }

      function addClickInterception(iframeDoc) {
        let anchorLinks = iframeDoc.querySelectorAll('a[href*="#"]');
        anchorLinks.forEach(function (anchor) {
          anchor.addEventListener('click', function (event) {
            event.preventDefault();

            const href = this.getAttribute('href');
            const hrefSplit = href.split('#');
            const pageUrl = hrefSplit[0] || '';
            const anchorId = hrefSplit[1] || '';

            if (!anchorId) return;

            // Same page anchor - handle internally
            if (!pageUrl || window.location.href.includes(pageUrl)) {
              scrollToAnchor(iframeDoc, anchorId);
            } else {
              // Different page with anchor - use parent navigation
              parent.window.location.href = href;
            }
          });
        });
      }

      function addBase(iframeDoc) {
        let base = iframeDoc.createElement('base');
        base.setAttribute('target', "_parent"); // Set to an appropriate base URL
        let head = iframeDoc.getElementsByTagName('head')[0];
        if (head) {
          head.insertBefore(base, head.firstChild);
        } else {
          head = iframeDoc.createElement('head');
          iframeDoc.documentElement.insertBefore(head, iframeDoc.body);
          head.appendChild(base);
        }
      }
    </script>

     <script>
      var r = document.querySelector(':root');
      const messageVisibilitySeconds = 6;
      const opacityTransitionTime = 0.15; // matches the tailwind transition-opacity time
      const delay = ms => new Promise(res => setTimeout(res, ms));

      function modalSize(h,w) {
        var rs = getComputedStyle(r);
        r.style.setProperty('--modalWidth', w);
        r.style.setProperty('--modalHeight', h);
      }

      /********* Function to open modal ***********/
      function displayModal(height,width,src) {
        event.preventDefault()
        let modal = document.getElementById('modalOverlay');
        modal.classList.add('show-modal');
        modalSize(height,width);
        let modalframe = document.getElementById('modalFrame');
        modalframe.setAttribute("src", src);
      }

      function closeModal() {
        let modal = document.getElementById('modalOverlay');
        modal.classList.remove('show-modal');
      }

      const hideMessage = async () => {
        const message = document.getElementById('messages');
        message.classList.add('opacity-0');
        await delay(opacityTransitionTime * 1000);
        const messageButton = message.querySelector('button');
        if (messageButton) {
          messageButton.click();
        }
      }

      const providerMatchesLastLogin = async (provider) => {
        const lastLoginProvider = localStorage.getItem('boostLoginMethod') || null;
        return provider === lastLoginProvider;
      }

      const trackLoginUpdateCheck = async () => {
        const footer = document.querySelector('footer');
        if (!footer) {
          return;
        }
        const indicator = footer.dataset.trackLoginMethod; // intentionally not cast to boolean
        const loginMethod = footer.dataset.loginMethod;
        if (indicator) {
          if (indicator === 'True') {
            localStorage.setItem('boostLoginMethod', loginMethod);
          } else {
            localStorage.removeItem('boostLoginMethod');
          }
        }
      }

      const changeVersionAndCategory = (event) => {
        const urlPatterns = {
          libraries: {
            regex: /^(https?:\/\/[\S:]+\/libraries\/)([^\/]+)(\/?[a-z]*)(\/?\S*)?\/?$/,
            substitution: (event) => {
              switch (event.target.id) {
                case 'id_category':
                  return `$1$2$3${event.target.value ? `/${event.target.value}` : ''}/`;
                case 'id_version':
                  return `$1${event.target.value}$3$4`;
                default:
                  return null;
              }
            }
          },
          library: {
            regex: /^(https?:\/\/[\S:]+\/library\/)([^\/]+)\/([^\/]+)\/?$/,
            substitution: (event) => `$1${event.target.value}/$3/`
          },
          releases: {
            regex: /^(https?:\/\/[\S:]+\/releases\/)([^\/]+)?\/?$/,
            substitution: (event) => `$1${event.target.value}/`
          }
        };

        const currentUrl = window.location.href;
        for (const key in urlPatterns) {
          const pattern = urlPatterns[key];
          if (pattern.regex.test(currentUrl)) {
            const substitutionString = pattern.substitution(event);
            if (substitutionString) {
              window.location.href = currentUrl.replace(pattern.regex, substitutionString);
            }
            break;
          }
        }
      }

      const manualPlausibleTrigger = async () => {
        window.plausible = window.plausible || function() {
          (window.plausible.q = window.plausible.q || []).push(arguments)
        }
        let loc = window.parent.location.href || window.location.href;
        plausible("pageview", { u: loc + window.location.search });
      };

      window.addEventListener('DOMContentLoaded', () => {
        // resets the form on back button press
        document.getElementById("id_category")?.closest('form').reset();
        document.getElementById("id_version")?.closest('form').reset();
        document.getElementById("id_category")?.addEventListener("change", changeVersionAndCategory);
        document.getElementById("id_version")?.addEventListener("change", changeVersionAndCategory);
        manualPlausibleTrigger();
      });
      (async () => {
        await trackLoginUpdateCheck();
        await delay(messageVisibilitySeconds * 1000);
        await hideMessage();
      })();
   </script>

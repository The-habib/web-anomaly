h&quot;,&quot;readMoreText&quot;:&quot;&quot;}]},{&quot;title&quot;:&quot;Investing in scientists across career stages&quot;,&quot;introduction&quot;:&quot;&lt;p&gt;Our&amp;nbsp;transformative programs&amp;nbsp;accelerate the success of scientists across career stages through long-term commitments that equip&amp;nbsp;them with the resources and community for breakthrough science. From PhD students and postdoctoral scientists to early, mid-career, and senior faculty,&amp;nbsp;our model advances basic&amp;nbsp;science and human health on a&amp;nbsp;rapid, ongoing basis.&amp;nbsp;&lt;\/p&gt;\r\n\r\n&lt;p&gt;&lt;hhmi-button mode=\&quot;LIGHT\&quot; variant=\&quot;arrowpill\&quot; href=\&quot;https:\/\/www.hhmi.org\/programs\&quot; icon=\&quot;\&quot; arialabel=\&quot;Learn more\&quot;&gt;Learn more&lt;\/hhmi-button&gt;&lt;button aria-label=\&quot;More actions\&quot; aria-haspopup=\&quot;menu\&quot; aria-expanded=\&quot;false\&quot; data-qa=\&quot;more_message_actions\&quot; data-focus-key=\&quot;message_actions\&quot; data-focus-metadata=\&quot;{&amp;quot;id&amp;quot;:&amp;quot;C04JYF04Q4Q&amp;quot;,&amp;quot;params&amp;quot;:{&amp;quot;messageContainerType&amp;quot;:&amp;quot;Channel&amp;quot;},&amp;quot;uiState&amp;quot;:{&amp;quot;ts&amp;quot;:&amp;quot;1692630719.060919&amp;quot;,&amp;quot;button&amp;quot;:&amp;quot;more_actions&amp;quot;}}\&quot; delay=\&quot;60\&quot; data-sk=\&quot;tooltip_parent\&quot; type=\&quot;button\&quot;&gt;&lt;\/button&gt;&lt;\/p&gt;\r\n&quot;,&quot;variant&quot;:&quot;column&quot;,&quot;position&quot;:&quot;left&quot;,&quot;backgrounds&quot;:[{&quot;visible&quot;:true,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/xin-jin-hp_0.jpg?itok=xUIH1gjQ&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/xin-jin-hp_0.jpg?itok=xUIH1gjQ 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2026-05\/xin-jin-hp_0.jpg?itok=uggd_OnM 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2026-05\/xin-jin-hp-mobile_0.jpg?itok=HuVFfNC1 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2026-05\/xin-jin-hp-mobile_0.jpg?itok=2PVbrut5 780w&quot;,&quot;eager&quot;:false},{&quot;visible&quot;:false,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2023-08\/hhmi-homepage-MCS_6277-v2.jpg?itok=MfWqmXL-&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2023-08\/hhmi-homepage-MCS_6277-v2.jpg?itok=MfWqmXL- 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2023-08\/hhmi-homepage-MCS_6277-v2.jpg?itok=SA0pknve 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2023-08\/hhmi-homepage-mobile-MCS_6277.jpg?itok=z_0DYQ8f 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2023-08\/hhmi-homepage-mobile-MCS_6277.jpg?itok=s3kV2c-6 780w&quot;,&quot;eager&quot;:false}]},{&quot;title&quot;:&quot;Reaching classrooms across the country &quot;,&quot;introduction&quot;:&quot;&lt;p&gt;HHMI supports innovative, frontline approaches to science education that reach both teachers and students, transforming learning into a hands-on, creative, and interdisciplinary endeavor that reflects the excitement of real research. BioInteractive \u2014 a leading provider of free classroom resources and professional development for high school and undergraduate biology educators \u2014 works alongside other HHMI education programs to inspire the next generation of scientists.&lt;\/p&gt;\r\n\r\n&lt;p&gt;&lt;hhmi-button mode=\&quot;LIGHT\&quot; variant=\&quot;arrowpill\&quot; href=\&quot;https:\/\/www.hhmi.org\/science-education\&quot; icon=\&quot;\&quot; arialabel=\&quot;Learn more\&quot;&gt;Learn more&lt;\/hhmi-button&gt;&lt;\/p&gt;\r\n&quot;,&quot;variant&quot;:&quot;column&quot;,&quot;position&quot;:&quot;right&quot;,&quot;backgrounds&quot;:[{&quot;visible&quot;:true,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/biointeractive-hpimage_1.jpeg?itok=bvpu0j0c&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/biointeractive-hpimage_1.jpeg?itok=bvpu0j0c 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2026-05\/biointeractive-hpimage_1.jpeg?itok=Cja2CLeO 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2026-05\/biointeractive-mobile.jpeg?itok=6u7gWkqC 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2026-05\/biointeractive-mobile.jpeg?itok=nNzHr-pM 780w&quot;,&quot;eager&quot;:false},{&quot;visible&quot;:false,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2023-09\/hhmi-homepage-news%26media-2.jpg?itok=SQq_aJNm&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2023-09\/hhmi-homepage-news%26media-2.jpg?itok=SQq_aJNm 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2023-09\/hhmi-homepage-news%26media-2.jpg?itok=YvN8AAAT 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2023-09\/hhmi-homepage-mobile-news%26media.jpg?itok=NnKV0WAM 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2023-09\/hhmi-homepage-mobile-news%26media.jpg?itok=j50w5k4A 780w&quot;,&quot;eager&quot;:false}]},{&quot;title&quot;:&quot;Sharing powerfully human science stories &quot;,&quot;introduction&quot;:&quot;&lt;p&gt;Science doesn\u2019t stop in the lab \u2014 its real-world impact on patients, families, and communities changes lives, as well as the world we live in. The award-winning media produced by HHMI\u2019s Tangled Bank Studios shines a light on some of the most significant scientific breakthroughs of&amp;nbsp;our time, fostering a public appreciation for science that&#039;s built on human connection. &amp;nbsp;&lt;\/p&gt;\r\n\r\n&lt;p&gt;&lt;hhmi-button mode=\&quot;LIGHT\&quot; variant=\&quot;arrowpill\&quot; href=\&quot;https:\/\/www.tangledbankstudios.org\/\&quot; icon=\&quot;\&quot; role=\&quot;link\&quot; arialabel=\&quot;Learn more\&quot;&gt;Learn more&lt;\/hhmi-button&gt;&lt;\/p&gt;\r\n&quot;,&quot;variant&quot;:&quot;column&quot;,&quot;position&quot;:&quot;left&quot;,&quot;backgrounds&quot;:[{&quot;visible&quot;:true,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/tbs-birds-hp_0.jpg?itok=lbZCMOjH&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/tbs-birds-hp_0.jpg?itok=lbZCMOjH 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2026-05\/tbs-birds-hp_0.jpg?itok=OrbRlFH4 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2026-05\/tbs-birds-hp-mobile_0.jpg?itok=ID6i71wx 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2026-05\/tbs-birds-hp-mobile_0.jpg?itok=QUxOF_p3 780w&quot;,&quot;eager&quot;:false},{&quot;visible&quot;:false,&quot;image&quot;:&quot;&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;&quot;,&quot;mobile-jpg&quot;:&quot;&quot;,&quot;eager&quot;:false}]},{&quot;title&quot;:&quot;Our Approach&quot;,&quot;introduction&quot;:&quot;&lt;p&gt;HHMI prioritizes long-term investment in talented scientists, and fostering community among the scientists, educators, and students we serve. Rooted in the belief that sustained resources and strong support networks advance discovery and perseverance in science, our model results in bold leaps forward in sciences, new tools and innovations used in labs around the world, and discoveries that advance human health for decades to come.&amp;nbsp;&lt;\/p&gt;\r\n\r\n&lt;p&gt;&lt;hhmi-button mode=\&quot;LIGHT\&quot; variant=\&quot;arrowpill\&quot; href=\&quot;https:\/\/www.hhmi.org\/our-approach\&quot; icon=\&quot;\&quot; arialabel=\&quot;Learn more\&quot;&gt;Learn more&lt;\/hhmi-button&gt;&lt;\/p&gt;\r\n&quot;,&quot;variant&quot;:&quot;column&quot;,&quot;position&quot;:&quot;right&quot;,&quot;backgrounds&quot;:[{&quot;visible&quot;:true,&quot;image&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/pagliarini-hp-desktopv2_0.jpg?itok=eo0uXwWs&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;\/sites\/default\/files\/styles\/3840x2400\/public\/2026-05\/pagliarini-hp-desktopv2_0.jpg?itok=eo0uXwWs 3840w, \/sites\/default\/files\/styles\/1920x1200\/public\/2026-05\/pagliarini-hp-desktopv2_0.jpg?itok=aCXcmesD 1920w&quot;,&quot;mobile-jpg&quot;:&quot;\/sites\/default\/files\/styles\/1560x2000\/public\/2026-05\/pagliarini-hp-mobile.jpg?itok=QQzEbFg9 1560w, \/sites\/default\/files\/styles\/780x1000\/public\/2026-05\/pagliarini-hp-mobile.jpg?itok=Sq8FknT5 780w&quot;,&quot;eager&quot;:false},{&quot;visible&quot;:false,&quot;image&quot;:&quot;&quot;,&quot;palette&quot;:&quot;LIGHT&quot;,&quot;desktop-jpg&quot;:&quot;&quot;,&quot;mobile-jpg&quot;:&quot;&quot;,&quot;eager&quot;:false}]}]'></hhmi-homepage><hhmi-cards-grid label='Latest News & Stories' seeAllText='ALL NEWS & STORIES' seeAllUrl='/news' variant='TWO_COLUMN' palette='' padding='BOTH' cardsProps='[{&quot;size&quot;:&quot;LARGE&quot;,&quot;heading&quot;:&quot;Meet Ann Hermundstad, Leader of HHMI Janelia\u2019s Newest Initiative, Theory@HHMI&quot;,&quot;label&quot;:&quot;Aug 10, 2026&quot;,&quot;subtitle&quot;:&quot;Janelia Group Leader Ann Hermundstad will lead a new HHMI Janelia Initiative called Theory@HHMI, which joins Biology, Tools@HHMI (formerly Molecular Tools &amp;amp; Imaging), and AI@HHMI in advancing Janelia&amp;rsquo;s grand challenge to understand how the brain generates behavior, and in strengthening scientific capability across HHMI. &quot;,&quot;imgSrc&quot;:&quot;https:\/\/www.hhmi.org\/sites\/default\/files\/2026-08\/ann-hermundstad-meta.png&quot;,&q

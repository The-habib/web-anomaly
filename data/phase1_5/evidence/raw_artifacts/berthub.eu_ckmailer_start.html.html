<!DOCTYPE html>
<html>
  <head>
    <title>Sign-in or sign-on</title>
    <meta charset="utf-8">
    <meta property='og:title' content='Sign-on or sign-on'>
    
    <link rel='stylesheet' href='pico.min.css' />
    <style>
      th {
    font-size: 100%;
}
tr,td {
    vertical-align: top;
    font-size: 90%;
}
.interrumpant {
          background-color: var(--pico-mark-background-color);
}

span.jarig::before { content: '🎈'; }


    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    

    <script defer src="logic.js"></script>
    <script defer src="alpine.min.js"></script>
    

  </head>
  
  <body>
    <div 
x-data="{
state: 0,
email: ''
}"
>
      <header class="container">
	
<h1>Manage your account, OR create one</h1>


      </header>
      <main class="container">
	
<template x-if="state==0">
  <div>
    <p>
      To subscribe to a mailing list, or to manage any existing subscriptions, fill out your email address below and press enter. You'll receive an email containing a link that will either activate your new account, or allow you to manage an existing one.
    </p>
    <form @submit.prevent="doRequestAccountPage($data, '');">
      <fieldset role="group">
      <input x-model="email" name="email" size="80" placeholder="email address" autofocus required type="email">
      <input type="submit" value="Submit">
      </fieldset>
    </form>  
    <p>
      The following mailing lists are available:
    </p>
    <ul>
      
      <li  ><b><a href="channel.html?channelId=idsiTaEVJkseo3uYK2TU-k">Bert Hubert Nederlands</a></b>: Updates over praatjes, blogposts voor een Nederlands publiek
      &nbsp;<a href="channel-index.xml?channelId=idsiTaEVJkseo3uYK2TU-k"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=qXN2Hp8xLw4zggLTYlB71E">Bert Hubert Nerd Stuff</a></b>: Technical, computer, technology updates from Bert Hubert
      &nbsp;<a href="channel-index.xml?channelId=qXN2Hp8xLw4zggLTYlB71E"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=J-8r8VuaDKIpFS5PGRcrWY">Bert Hubert Non-nerdy Updates</a></b>: Updates on posts, talks, excluding really technical stuff
      &nbsp;<a href="channel-index.xml?channelId=J-8r8VuaDKIpFS5PGRcrWY"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=l8weBUrerkgqppOFSqmzTE">Cloud Kootwijk Algemeen</a></b>: Updates over het Cloud Kootwijk project
      &nbsp;<a href="channel-index.xml?channelId=l8weBUrerkgqppOFSqmzTE"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=ndscVIUwnhkKdJC-GsCiWQ">Galmon</a></b>: Updates on the galmon.eu GNSS monitoring project
      &nbsp;<a href="channel-index.xml?channelId=ndscVIUwnhkKdJC-GsCiWQ"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=FxRgoCkB2OQbMnKJHwpSM0">OpenTK</a></b>: Updates over de https://opentk.nl/ Tweede Kamer monitor
      &nbsp;<a href="channel-index.xml?channelId=FxRgoCkB2OQbMnKJHwpSM0"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=PDAqksrc174OEgKgfgk1sw">Testlist</a></b>: Een testlijst
      &nbsp;<a href="channel-index.xml?channelId=PDAqksrc174OEgKgfgk1sw"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
      <li  ><b><a href="channel.html?channelId=7nsPEerJaakYh6stQmDvfY">nerdvote</a></b>: Alles over NerdVote.nl
      &nbsp;<a href="channel-index.xml?channelId=7nsPEerJaakYh6stQmDvfY"><img width="24" src="Generic_Feed-icon.svg"></a>
      </li>
      
    </ul>

    <p>Privacy policy: your data will not be sold and won't be shared with any one
    (unless required by law). We'll also not contact you via email, except for messages you explicitly subscribed to. If we do contact you it is because there is an urgent reason to, like for example a data breach. Except for your email address and your subscriptions, we store no data about you, not even your name nor a password. We do however temporarily store log files to investigate problems, but these log files do not contain any personal details.
    </p>
    <p>
      This service runs on <a href="https://www.lenovo.com/nl/nl/p/desktops/thinkcentre/m-series-tiny/thinkcentre-m70q/wmd00000405">my small server</a> in my home, and not on any cloud.
    </p>
    <p>
      For any questions or access to your data, or removal requests, please contact <a href="https://berthub.eu">Bert Hubert</a>, bert@hubertnet.nl
    </p>
  </div>
</template>

<template x-if="state==1">
  <div>
    <p>
      We just sent an email to <b><span x-text="email"></span></b>, containing a link to activate or manage your account.
    </p>
    <p>
      Please wait for that email to arrive and then click the link in there to proceed. <b>Please also check your spam folder!</b>. If no mail arrives, do email bert@hubertnet.nl so I can fix things for you.
    </p>
  </div>
</template>



      </main>
    </div>

  </body>
</html>
